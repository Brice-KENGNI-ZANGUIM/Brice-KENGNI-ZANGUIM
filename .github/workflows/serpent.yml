# L'animation du calendrier des contributions, en deux versions (themes clair et sombre), publiee
# chaque nuit sur la branche "output" de ce depot, que le README lit.
name: Animation des contributions
on:
  schedule:
    - cron: "41 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/serpent.yml"]
permissions:
  contents: write
jobs:
  serpent:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#22D3EE
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
