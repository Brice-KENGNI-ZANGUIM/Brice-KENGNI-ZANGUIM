# Les metriques du profil : une image SVG regeneree chaque nuit et a chaque modification, puis
# commitee dans ce depot (metrics/general.svg). Demande le secret METRICS_TOKEN (INSTALLATION.md).
name: Metriques du profil
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/metriques.yml"]
permissions:
  contents: write
jobs:
  metriques:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: Brice-KENGNI-ZANGUIM
          filename: metrics/general.svg
          template: classic
          base: header
          config_timezone: Europe/Paris
          config_display: large
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: percentage
          plugin_languages_limit: 6
          plugin_languages_ignored: html, css, jupyter notebook, inno setup, batchfile, procfile, dockerfile
